<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>えいごゲームひろば | Mark Sensei's</title>
<meta name="description" content="えいごを たのしく まなべる ゲームが いっぱい！">
<meta name="theme-color" content="#2457E6">
<link rel="icon" href="/games/images/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2457E6;
    --blue-dark:#1A43BC;
    --blue-deep:#16349A;
    --sky:#E4F3FF;
    --sky-2:#CFE9FF;
    --orange:#FF7A1A;
    --orange-dark:#D95E00;
    --yellow:#FFC928;
    --green:#22B35E;
    --pink:#F2478E;
    --teal:#13A8C2;
    --ink:#1C2A4E;
    --ink-2:#4B5A7C;
    --white:#fff;
    --card-shadow:0 6px 18px rgba(28,62,140,.13);
    --card-shadow-hover:0 14px 30px rgba(28,62,140,.22);
    --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font);font-weight:700;color:var(--ink);-webkit-font-smoothing:antialiased;
    background-color:var(--sky);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(36,87,230,.10) 1.5px, transparent 2px);
    background-size:26px 26px;
  }
  ::selection{background:var(--yellow);color:var(--ink)}
  .games{scroll-margin-top:16px}
  img{display:block}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  :focus-visible{outline:4px solid var(--yellow);outline-offset:3px;border-radius:12px}
  .container{max-width:1200px;margin:0 auto;padding:0 24px}
  .jp{word-break:keep-all;overflow-wrap:anywhere}

  /* ================= Header ================= */
  .site-header{background:var(--blue);position:relative;z-index:3}
  .site-header .container{display:flex;align-items:center;height:82px;gap:20px}
  .logo{display:flex;align-items:center;gap:12px;color:#fff}
  .logo-mark{width:60px;height:60px;flex:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  .logo:hover .logo-mark{transform:rotate(-10deg) scale(1.08)}
  .logo-text{line-height:1}
  .logo-text small{display:block;font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--yellow)}
  .logo-text strong{display:block;font-size:29px;font-weight:900;letter-spacing:.02em;margin-top:3px}
  .nav{margin-left:auto;display:flex;gap:6px}
  .nav a{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:6px 14px;border-radius:14px;color:#fff;font-size:14px;font-weight:800;
    transition:background .15s;
  }
  .nav a:hover{background:rgba(255,255,255,.14)}
  .nav .ni{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
  .nav a:hover .ni{transform:translateY(-2px) scale(1.08)}
  .nav .ni svg{width:20px;height:20px}
  /* curved bottom edge */
  .header-curve{display:block;width:100%;height:28px;margin-top:-1px}

  /* ================= Hero carousel ================= */
  .hero{margin-top:6px;position:relative}
  .hero-frame{
    position:relative;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
    border-radius:26px;overflow:hidden;background:var(--hc,#2457E6);
    box-shadow:0 10px 28px rgba(28,62,140,.22);
    transition:background-color .5s;
    min-height:340px;
  }
  .hero-art{position:relative;display:block;overflow:hidden;background:#cfe0f2}
  .hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.03);transition:opacity .55s, transform 6s ease-out}
  .hero-art img.on{opacity:1;transform:scale(1)}
  .hero-info{
    position:relative;color:#fff;padding:32px 34px 30px;
    display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  }
  .hero-info .deco{position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero-info .deco.two{right:auto;left:-40px;top:auto;bottom:-90px;width:200px;height:200px;background:rgba(255,255,255,.06)}
  .hero-cat{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 13px 5px 8px;font-size:14px;font-weight:800;position:relative}
  .hero-cat svg{width:18px;height:18px}
  .hero-title{margin:12px 0 0;font-size:40px;font-weight:900;line-height:1.15;position:relative}
  .hero-en{font-size:17px;font-weight:800;opacity:.8;margin-top:4px;position:relative}
  .hero-desc{margin:14px 0 0;font-size:19px;font-weight:800;line-height:1.5;position:relative}
  .hero-learn{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
  .hero-learn .lbl{font-size:13.5px;font-weight:800;opacity:.85;margin-right:2px}
  .hero-learn .chip{background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:800}
  .play-btn{
    position:relative;margin-top:22px;
    display:inline-flex;align-items:center;gap:10px;
    background:var(--orange);color:#fff;
    border-radius:999px;padding:12px 30px 12px 14px;
    font-size:23px;font-weight:900;letter-spacing:.08em;
    box-shadow:0 5px 0 var(--orange-dark);
    transition:transform .12s, box-shadow .12s, background .15s;
  }
  .play-btn .pi{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center}
  .play-btn .pi svg{width:16px;height:16px;fill:var(--orange);margin-left:3px}
  .play-btn:hover{background:#FF8A33;transform:translateY(-2px);box-shadow:0 7px 0 var(--orange-dark)}
  .play-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-dark)}

  .arrow{
    position:absolute;top:50%;z-index:2;width:52px;height:52px;margin-top:-26px;border-radius:50%;
    background:#fff;color:var(--blue);display:grid;place-items:center;
    box-shadow:0 4px 12px rgba(28,62,140,.25);
    transition:transform .15s;
  }
  .arrow svg{width:22px;height:22px}
  .arrow:hover{transform:scale(1.1)}
  .arrow.prev{left:-20px}
  .arrow.next{right:-20px}
  .dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
  .dots button{width:12px;height:12px;border-radius:999px;background:#A9C8F2;transition:width .25s, background .25s}
  .dots button[aria-selected="true"]{width:34px;background:var(--blue)}

  /* ================= Category bubbles ================= */
  .section-title{display:flex;align-items:center;gap:10px;margin:0;font-size:26px;font-weight:900}
  .section-title .st-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--yellow)}
  .section-title .st-ic svg{width:24px;height:24px}
  .pick{margin-top:34px;background:#fff;border-radius:26px;padding:22px 28px 24px;box-shadow:var(--card-shadow);display:flex;align-items:center;gap:32px}
  .pick .section-title{flex:none}
  .bubbles{display:flex;flex:1;justify-content:space-around;gap:16px;flex-wrap:wrap}
  .bubble{display:flex;flex-direction:column;align-items:center;gap:8px;width:120px}
  .bubble .circle{
    width:96px;height:96px;border-radius:50%;background:var(--bc);
    display:grid;place-items:center;position:relative;
    box-shadow:0 6px 0 rgba(0,0,0,.12);
    transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s;
  }
  .bubble .circle svg{width:50px;height:50px}
  .bubble .count{position:absolute;top:-4px;right:-4px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:#fff;color:var(--bc);font-size:15px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .bubble .bl{font-size:15px;font-weight:900;text-align:center;line-height:1.3}
  .bubble:hover .circle{transform:translateY(-4px) scale(1.05)}
  .bubble[aria-pressed="true"] .circle{box-shadow:0 0 0 5px #fff, 0 0 0 9px var(--bc)}
  .bubble[aria-pressed="true"] .bl{color:var(--bc)}

  /* ================= Game cards ================= */
  .games{margin-top:38px}
  .games-head{display:flex;align-items:baseline;justify-content:space-between}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:18px}
  .card{
    position:relative;display:flex;flex-direction:column;
    background:#fff;border-radius:20px;overflow:hidden;
    box-shadow:var(--card-shadow);
    transition:transform .2s cubic-bezier(.3,1.4,.5,1), box-shadow .2s;
  }
  .card[hidden]{display:none}
  .card:hover{transform:translateY(-6px);box-shadow:var(--card-shadow-hover)}
  .thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--c)}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
  .thumb::after{content:"";position:absolute;inset:0;background:rgba(20,30,70,0);transition:background .2s}
  .card:hover .thumb img{transform:scale(1.06)}
  .card:hover .thumb::after{background:rgba(20,30,70,.25)}
  .thumb .hover-play{
    position:absolute;left:50%;top:50%;z-index:1;width:64px;height:64px;margin:-32px 0 0 -32px;
    border-radius:50%;background:var(--orange);display:grid;place-items:center;
    box-shadow:0 4px 0 var(--orange-dark);
    transform:scale(.4);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1), opacity .15s;
  }
  .thumb .hover-play svg{width:24px;height:24px;fill:#fff;margin-left:4px}
  .catrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
  .catrow .cat{margin-bottom:0}
  .new-badge{flex:none;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:900;letter-spacing:.04em;border-radius:999px;padding:2px 10px;box-shadow:0 2px 0 rgba(0,0,0,.16);transform:rotate(3deg);animation:wob 2.4s ease-in-out infinite}
  @keyframes wob{50%{transform:rotate(-3deg) scale(1.08)}}
  .new-badge.upd,.hero-new.upd{background:var(--green);color:#fff}
  .hero-new{background:var(--yellow);color:var(--ink);border-radius:999px;padding:1px 8px;margin-left:4px;font-weight:900}
  .card:hover .hover-play,.card:focus-visible .hover-play{transform:scale(1);opacity:1}
  .card-body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1;border-top:5px solid var(--c)}
  .card .cat{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;color:var(--tc);margin-bottom:3px}
  .card .cat svg{width:16px;height:16px}
  .card h3{margin:0;font-size:19px;font-weight:900;line-height:1.3}
  .card .en{font-size:13px;font-weight:800;color:var(--ink-2);opacity:.75;margin-top:2px}
  .card p{margin:8px 0 12px;font-size:15px;font-weight:700;line-height:1.5;color:var(--ink-2)}
  .card .meta{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;font-weight:800;color:var(--ink-2);background:#F1F6FD;border-radius:12px;padding:7px 8px}
  .card .meta .jp{min-width:0;white-space:normal;line-height:1.3}
  .card .meta .lb{flex:none;background:var(--c);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:900}
  .tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px 3px 7px;font-size:12.5px;font-weight:900;background:var(--tc);color:#fff}
  .tag svg{width:14px;height:14px}
  .learn{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;background:#EEF4FC;color:var(--ink-2)}

  /* ================= Footer ================= */
  footer{margin-top:64px;color:#fff}
  footer svg.wave{display:block;width:100%;height:40px}
  .foot{background:var(--blue-deep);padding:18px 0 30px}
  .foot .container{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .foot .logo-mark{width:44px;height:44px}
  .foot p{margin:0;font-size:16px;font-weight:800}
  .foot small{margin-left:auto;font-size:13px;font-weight:700;opacity:.75}

  /* ================= Polish ================= */
  .jp, .hero-title, .card h3{text-wrap:balance}
  .card p.jp{text-wrap:pretty}

  /* header: twinkling stars + current-category marker */
  .site-header{overflow:visible}
  .site-header .sparks{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .spark{position:absolute;width:14px;height:14px;fill:#FFC928;opacity:.0;animation:twinkle 4.6s ease-in-out infinite}
  .spark.s1{left:36%;top:16px}
  .spark.s2{left:52%;top:46px;width:10px;height:10px;animation-delay:1.4s}
  .spark.s3{left:61%;top:14px;width:9px;height:9px;fill:#fff;animation-delay:2.6s}
  .spark.s4{left:29%;top:50px;width:9px;height:9px;fill:#fff;animation-delay:3.4s}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(25deg)}}
  .site-header .container{position:relative}
  .nav a{position:relative}
  .nav a.on::after{content:"";position:absolute;left:18px;right:18px;bottom:-3px;height:4px;border-radius:4px;background:var(--yellow)}

  /* hero: content swaps in, autoplay progress, soft drifting circles */
  .hero-info .deco{animation:drift 14s ease-in-out infinite alternate}
  .hero-info .deco.two{animation-duration:18s}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-18px,14px) scale(1.12)}}
  .hero-info.swap > :not(.deco){animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards}
  .hero-info.swap > .hero-title{animation-delay:.05s}
  .hero-info.swap > .hero-en{animation-delay:.09s}
  .hero-info.swap > .hero-desc{animation-delay:.13s}
  .hero-info.swap > .hero-learn{animation-delay:.18s}
  .hero-info.swap > .play-btn{animation-delay:.23s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .hero-frame{touch-action:pan-y}
  .dots button{position:relative;overflow:hidden}
  .dots button[aria-selected="true"]{background:#A9C8F2}
  .dots button::after{content:"";position:absolute;inset:0;background:var(--blue);border-radius:inherit;transform-origin:left;transform:scaleX(0)}
  .dots button[aria-selected="true"]::after{transform:scaleX(1);animation:fill 6s linear backwards}
  .hero.paused .dots button[aria-selected="true"]::after{animation-play-state:paused}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .dots button:hover{background:#7FA9EA}
  /* play button: a gentle ring that invites a tap */
  .play-btn::before{content:"";position:absolute;inset:0;border-radius:inherit;border:3px solid rgba(255,255,255,.7);animation:ring 2.6s ease-out infinite;pointer-events:none}
  .play-btn:hover::before{animation:none;opacity:0}
  @keyframes ring{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(1.22,1.45);opacity:0}}
  .play-btn.wiggle{animation:wiggle .7s}
  @keyframes wiggle{20%{transform:rotate(-4deg) scale(1.06)}45%{transform:rotate(3deg) scale(1.06)}70%{transform:rotate(-2deg)}100%{transform:none}}

  /* bubbles */
  .bubble:active .circle{transform:scale(.93)}
  .bubble .bl{transition:color .15s}
  .bubble[aria-pressed="true"] .circle{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}

  /* section head: count + surprise button */
  .games-head{align-items:center;gap:14px}
  .count-pill{margin-left:10px;background:#fff;color:var(--blue);border-radius:999px;padding:3px 13px;font-size:15px;font-weight:900;box-shadow:0 2px 6px rgba(28,62,140,.12);vertical-align:middle}
  .btn-random{
    margin-left:auto;display:inline-flex;align-items:center;gap:8px;
    background:#fff;color:var(--blue);border-radius:999px;padding:8px 18px 8px 10px;
    font-size:16px;font-weight:900;box-shadow:0 4px 0 #BBD3F5;
    transition:transform .12s, box-shadow .12s, background .15s;
  }
  .btn-random svg{width:30px;height:30px;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
  .btn-random:hover{background:#F4F9FF;transform:translateY(-2px);box-shadow:0 6px 0 #BBD3F5}
  .btn-random:hover svg{transform:rotate(180deg)}
  .btn-random:active{transform:translateY(3px);box-shadow:0 1px 0 #BBD3F5}

  /* cards: entrance, press, image fade-in, always-visible play on touch */
  .card{animation:cardIn .55s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--n,0) * 55ms)}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
  .card:active{transform:translateY(-2px) scale(.985)}
  .thumb img{opacity:0;transition:opacity .4s, transform .35s}
  .thumb img.ld{opacity:1}
  .thumb.err{display:grid;place-items:center;text-align:center;color:#fff;font-size:20px;font-weight:900;padding:12px}
  .card p{min-height:3em}
  .card-body{transition:border-color .2s}
  .card:hover h3{color:var(--tc2,var(--ink))}
  .card .cat{letter-spacing:.02em}
  .empty{display:none;text-align:center;padding:40px 0;font-size:18px;color:var(--ink-2)}
  @media (hover:none){
    .thumb .hover-play{left:auto;top:auto;right:10px;bottom:10px;margin:0;width:46px;height:46px;transform:none;opacity:1;box-shadow:0 3px 0 var(--orange-dark)}
    .thumb .hover-play svg{width:18px;height:18px;margin-left:3px}
  }

  /* back to top */
  .to-top{
    position:fixed;right:18px;bottom:18px;z-index:5;width:52px;height:52px;border-radius:50%;
    background:var(--orange);color:#fff;display:grid;place-items:center;
    box-shadow:0 4px 0 var(--orange-dark), 0 8px 18px rgba(28,62,140,.25);
    opacity:0;transform:translateY(16px) scale(.8);pointer-events:none;
    transition:opacity .25s, transform .3s cubic-bezier(.3,1.6,.5,1);
  }
  .to-top.show{opacity:1;transform:none;pointer-events:auto}
  .to-top:hover{background:#FF8A33}
  .to-top:active{transform:translateY(3px)}
  .to-top svg{width:24px;height:24px}

  /* footer: a little rhythm */
  .foot p{flex:1;min-width:200px}
  .foot .logo-mark{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}

  /* ================= Responsive ================= */
  @media (max-width:1150px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .hero-title{font-size:32px}
  }
  @media (max-width:860px){
    .hero-frame{grid-template-columns:1fr}
    .hero-art{aspect-ratio:16/9}
    .arrow{top:28%}
    .arrow.prev{left:8px}.arrow.next{right:8px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .nav span.t{display:none}
  }
  @media (max-width:560px){
    .container{padding:0 16px}
    .site-header .container{height:64px}
    .logo-mark{width:44px;height:44px}
    .logo-text strong{font-size:21px}
    .nav{display:none}
    .hero-info{padding:22px 20px 24px}
    .hero-title{font-size:28px}
    .hero-desc{font-size:17px}
    .arrow{width:38px;height:38px;margin-top:-19px}
    .arrow svg{width:18px;height:18px}
    .btn-random span{display:none}
    .btn-random{padding:6px}
    .to-top{right:12px;bottom:12px;width:46px;height:46px}
    .pick{flex-direction:column;align-items:flex-start;gap:16px;padding:18px 14px}
    .bubbles{gap:6px;justify-content:space-between;width:100%}
    .bubble{width:76px}
    .bubble .circle{width:70px;height:70px}
    .bubble .circle svg{width:38px;height:38px}
    .bubble .bl{font-size:13px}
    .grid{grid-template-columns:1fr}
    .section-title{font-size:22px}
  }
  /* Chromebook window (short screen) */
  @media (min-width:861px) and (max-height:720px){
    .site-header .container{height:66px}
    .logo-mark{width:48px;height:48px}
    .header-curve{height:20px}
    .hero-frame{min-height:0}
    .hero-art{aspect-ratio:auto;height:300px}
    .hero-info{padding:22px 30px}
    .hero-title{font-size:34px;margin-top:10px}
    .hero-desc{font-size:17px;margin-top:10px}
    .play-btn{margin-top:16px;font-size:21px;padding:10px 26px 10px 12px}
    .play-btn .pi{width:34px;height:34px}
    .dots{margin-top:10px}
    .pick{margin-top:26px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="logo" viewBox="0 0 64 64">

<script src="/games/games.js"></script>
<script>
  /* Games come from games.js (window.GAMES_TEXT). Edit that file, not this one. */
  const KNOWN = {
    eigo:  { label:"えいご",       color:"#F2478E", icon:"ic-eigo",  match:/えいご|英語|english/i },
    world: { label:"せかい・日本",  color:"#22B35E", icon:"ic-world", match:/せかい|世界|日本|にほん|world|japan/i },
    type:  { label:"タイピング",    color:"#13A8C2", icon:"ic-type",  match:/タイピング|たいぴんぐ|typ/i },
  };
  const EXTRA_COLORS = ["#FF8A00", "#E8483B", "#1F8FE0", "#6DB31B", "#0C7F8A"];
  const CATS = {};

  function categoryFor(text){
    const t = (text || "").trim();
    for (const [id, k] of Object.entries(KNOWN)) if (k.match.test(t)) { CATS[id] ??= k; return id; }
    const id = "c-" + (t || "other");
    CATS[id] ??= { label: t || "そのほか", color: EXTRA_COLORS[(Object.keys(CATS).length) % EXTRA_COLORS.length], icon:"ic-all", custom:true };
    return id;
  }

  /* Recency: a game is NEW for NEW_DAYS after it was made and shows UPDATE! for UPDATE_DAYS after its last update. */
  const NEW_DAYS = 14, UPDATE_DAYS = 14;
  function parseDate(v){ const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec((v || "").trim()); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
  const daysAgo = d => (Date.now() - d.getTime()) / 864e5;

  function parseGames(text){
    const out = [];
    for (const block of String(text || "").split(/\n\s*\n/)) {
      const f = {};
      for (const line of block.split("\n")) {
        const m = line.match(/^\s*([a-zA-Z]+)\s*[:：]\s*(.*)$/);
        if (m) f[m[1].toLowerCase()] = m[2].trim();
      }
      if (!Object.keys(f).length) continue;
      if (!f.name || !f.link || !f.image) { console.warn("games.js: a game needs name, link and image", f); continue; }
      out.push({
        ja: f.name, en: f.english || "", desc: f.about || "",
        learn: (f.learn || "").split(/[、,，]/).map(x => x.trim()).filter(Boolean),
        url: f.link, img: /^(https?:)?\/\//.test(f.image) ? f.image : "/games/" + f.image.replace(/^\.?\//, ""),
        cat: categoryFor(f.type),
        isNew: /^(yes|y|はい|true|new)$/i.test(f.new || ""),
        created: parseDate(f.created), updated: parseDate(f.updated),
        color: /^#[0-9a-f]{3,8}$/i.test(f.color || "") ? f.color : null,
      });
    }
    return out;
  }
  const GAMES = parseGames(window.GAMES_TEXT);
  GAMES.forEach((g, i) => {
    g.auto = !g.color; if (!g.color) g.color = CATS[g.cat].color;
    g.isNew = g.isNew || (g.created && daysAgo(g.created) <= NEW_DAYS);
    g.isUpd = !g.isNew && !!g.updated && daysAgo(g.updated) <= UPDATE_DAYS;
    g.pos = i;
  });
  /* Order: brand-new games first (newest first), then everything by most recent update.
     Games with no dates keep their place in games.js, after the dated ones. */
  const stamp = g => (g.updated || g.created || new Date(0)).getTime();
  GAMES.sort((a, b) =>
    (b.isNew - a.isNew) ||
    (a.isNew && b.isNew ? ((b.created || 0) - (a.created || 0)) : 0) ||
    (stamp(b) - stamp(a)) ||
    ((b.created || 0) - (a.created || 0)) ||
    (a.pos - b.pos));

  /* Pick a strong colour from the picture so a new game fits without choosing one. */
  function colourFromImage(src, done){
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => {
      try {
        const c = document.createElement("canvas"); c.width = c.height = 36;
        const x = c.getContext("2d", { willReadFrequently:true });
        x.drawImage(im, 0, 0, 36, 36);
        const d = x.getImageData(0, 0, 36, 36).data, bins = Array.from({length:12}, () => [0,0,0,0]);
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i]/255, g = d[i+1]/255, b = d[i+2]/255, mx = Math.max(r,g,b), mn = Math.min(r,g,b);
          const sat = mx ? (mx - mn) / mx : 0;
          if (mx < .25 || sat < .25) continue;
          let h = mx === mn ? 0 : mx === r ? ((g - b) / (mx - mn)) % 6 : mx === g ? (b - r) / (mx - mn) + 2 : (r - g) / (mx - mn) + 4;
          const bin = bins[(Math.round(h * 2) + 12) % 12], w = sat * sat * mx;
          bin[0] += r*w; bin[1] += g*w; bin[2] += b*w; bin[3] += w;
        }
        const best = bins.reduce((a, b) => b[3] > a[3] ? b : a);
        if (!best[3]) return done(null);
        let [r, g, b] = best.slice(0, 3).map(v => v / best[3]);
        // to HSL, then make it deep enough for white text
        const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx + mn) / 2, dd = mx - mn;
        let h = 0, s = dd ? dd / (1 - Math.abs(2*l - 1)) : 0;
        if (dd) h = mx === r ? ((g - b) / dd) % 6 : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;
        h = (h * 60 + 360) % 360;
        const L = Math.min(Math.max(l, .3), .42), S = Math.max(s, .6);
        done(`hsl(${Math.round(h)} ${Math.round(S*100)}% ${Math.round(L*100)}%)`);
      } catch (e) { done(null); }
    };
    im.onerror = () => done(null);
    im.src = src;
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const use = (id, cls = "") => `<svg ${cls} viewBox="0 0 48 48" aria-hidden="true"><use href="#${id}"/></svg>`;
  const PLAY = `<svg viewBox="0 0 24 24"><use href="#ic-play"/></svg>`;
  const ORDER = ["eigo", "world", "type"];
  const FILTERS = [{ id:"all", label:"ぜんぶ", color:"#FFB000", icon:"ic-all" },
                   ...Object.entries(CATS).map(([id, c]) => ({ id, ...c }))
                     .sort((x, y) => (ORDER.indexOf(x.id) + 1 || 99) - (ORDER.indexOf(y.id) + 1 || 99))];
  const count = id => id === "all" ? GAMES.length : GAMES.filter(g => g.cat === id).length;

  /* ---------- Header nav ---------- */
  $("nav").innerHTML = FILTERS.map(f =>
    `<a href="#games" data-f="${esc(f.id)}"><span class="ni" style="background:${f.color}">${use(f.icon)}</span><span class="t">${esc(f.label)}</span></a>`).join("");

  /* ---------- Bubbles ---------- */
  $("bubbles").innerHTML = FILTERS.map(f => `
    <button class="bubble" data-f="${esc(f.id)}" style="--bc:${f.color}" aria-pressed="false">
      <span class="circle">${use(f.icon)}<span class="count">${count(f.id)}</span></span>
      <span class="bl jp">${esc(f.label)}</span>
    </button>`).join("");

  /* ---------- Cards ---------- */
  $("grid").innerHTML = GAMES.map((g, i) => {
    const c = CATS[g.cat];
    return `
    <a class="card" href="${esc(g.url)}" data-cat="${esc(g.cat)}" data-i="${i}" style="--c:${g.color};--n:${i}" aria-label="${esc(g.ja)}${g.en ? "（" + esc(g.en) + "）" : ""}">
      <div class="thumb"><img src="${esc(g.img)}" alt="" loading="lazy" width="760" height="400"><span class="hover-play">${PLAY}</span></div>
      <div class="card-body">
        <div class="catrow"><div class="cat" style="--tc:${c.color}">${use(c.custom ? "ic2-all" : c.icon.replace("ic-","ic2-"))}${esc(c.label)}</div>${g.isNew ? '<span class="new-badge">NEW!</span>' : g.isUpd ? '<span class="new-badge upd">UPDATE!</span>' : ""}</div>
        <h3 class="jp">${esc(g.ja)}</h3>
        ${g.en ? `<div class="en">${esc(g.en)}</div>` : ""}
        ${g.desc ? `<p class="jp">${esc(g.desc)}</p>` : `<p></p>`}
        ${g.learn.length ? `<div class="meta"><span class="lb">まなべる</span><span class="jp">${g.learn.map(esc).join("、")}</span></div>` : ""}
      </div>
    </a>`;}).join("");

  /* pictures fade in when ready; a broken picture falls back to a coloured tile with the name */
  document.querySelectorAll(".thumb img").forEach(im => {
    const ok = () => im.classList.add("ld");
    const bad = () => { const t = im.parentElement; t.classList.add("err"); im.remove(); t.insertBefore(document.createTextNode(GAMES[+t.closest(".card").dataset.i].ja), t.firstChild); };
    if (im.complete) (im.naturalWidth ? ok() : bad()); else { im.onload = ok; im.onerror = bad; }
  });

  function filter(id, replay = true){
    document.querySelectorAll(".bubble").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === id));
    document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", id !== "all" && a.dataset.f === id));
    let n = 0;
    document.querySelectorAll(".card").forEach(c => {
      c.hidden = !(id === "all" || c.dataset.cat === id);
      if (!c.hidden) {
        c.style.setProperty("--n", n++);
        if (replay) { c.style.animation = "none"; void c.offsetWidth; c.style.animation = ""; }
      }
    });
    const f = FILTERS.find(x => x.id === id);
    $("gamesTitle").textContent = id === "all" ? "ぜんぶの ゲーム" : `${f.label}の ゲーム`;
    $("gamesCount").textContent = `${n}こ`;
    $("empty").style.display = n ? "none" : "block";
    $("random").hidden = n === 0;
  }
  function applyColour(i, col){
    GAMES[i].color = col;
    const card = document.querySelector(`.card[data-i="${i}"]`);
    if (card) card.style.setProperty("--c", col);
    if (i === cur) frame.style.setProperty("--hc", col);
  }
  $("bubbles").addEventListener("click", e => { const b = e.target.closest(".bubble"); if (b) filter(b.dataset.f); });
  $("nav").addEventListener("click", e => { const a = e.target.closest("a"); if (a) filter(a.dataset.f); });
  filter("all", false);

  /* ---------- Hero carousel ---------- */
  const art = $("heroArt"), frame = $("heroFrame");
  GAMES.forEach(g => { const im = new Image(); im.src = g.img; im.alt = ""; art.appendChild(im); });
  const pics = [...art.children];
  $("dots").innerHTML = GAMES.map((g, i) => `<button role="tab" aria-label="${esc(g.ja)}" data-i="${i}"></button>`).join("");
  const dots = [...$("dots").children];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let cur = 0, timer;

  function show(i){
    cur = (i + GAMES.length) % GAMES.length;
    const g = GAMES[cur], c = CATS[g.cat];
    frame.style.setProperty("--hc", g.color);
    pics.forEach((p, k) => p.classList.toggle("on", k === cur));
    dots.forEach((d, k) => d.setAttribute("aria-selected", k === cur));
    $("heroCat").innerHTML = use(c.icon) + esc(c.label) + (g.isNew ? ' <span class="hero-new">NEW!</span>' : g.isUpd ? ' <span class="hero-new upd">UPDATE!</span>' : "");
    $("heroTitle").textContent = g.ja;
    $("heroEn").textContent = g.en;
    $("heroDesc").textContent = g.desc;
    $("heroLearn").innerHTML = g.learn.length ? `<span class="lbl">まなべること</span>` + g.learn.map(l => `<span class="chip">${esc(l)}</span>`).join("") : "";
    $("heroPlay").href = art.href = g.url;
    if (swapReady) { const info = document.querySelector(".hero-info"); info.classList.remove("swap"); void info.offsetWidth; info.classList.add("swap"); }
    swapReady = true;
    restart();
  }
  let swapReady = false;
  const hero = document.querySelector(".hero");
  function restart(){
    clearInterval(timer);
    hero.classList.remove("paused");
    if (!reduce) timer = setInterval(() => show(cur + 1), 6000);
  }
  function hold(){ clearInterval(timer); hero.classList.add("paused"); }
  $("prev").onclick = () => show(cur - 1);
  $("next").onclick = () => show(cur + 1);
  $("dots").addEventListener("click", e => { const d = e.target.closest("button"); if (d) show(+d.dataset.i); });
  hero.addEventListener("mouseenter", hold);
  hero.addEventListener("mouseleave", restart);
  hero.addEventListener("focusin", hold);
  hero.addEventListener("focusout", restart);
  /* swipe on touch screens */
  let sx = null, sy = 0;
  frame.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
  frame.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(cur + (dx < 0 ? 1 : -1));
  }, { passive:true });
  /* arrow keys */
  addEventListener("keydown", e => {
    if (e.target.closest("input,textarea,select") || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowLeft") show(cur - 1); else if (e.key === "ArrowRight") show(cur + 1);
  });
  show(0);

  /* ---------- おまかせ: jump to a surprise game ---------- */
  $("random").addEventListener("click", () => {
    const pool = [...document.querySelectorAll(".card:not([hidden])")].map(c => +c.dataset.i).filter(i => i !== cur);
    if (!pool.length) return;
    show(pool[Math.floor(Math.random() * pool.length)]);
    scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    const p = $("heroPlay"); p.classList.remove("wiggle"); void p.offsetWidth; p.classList.add("wiggle");
  });

  /* ---------- back to top ---------- */
  const toTop = $("toTop");
  const onScroll = () => toTop.classList.toggle("show", scrollY > 520);
  addEventListener("scroll", onScroll, { passive:true }); onScroll();
  toTop.addEventListener("click", () => scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }));

  /* colours for games that did not set one */
  GAMES.forEach((g, i) => { if (g.auto) colourFromImage(g.img, col => { if (col) applyColour(i, col); }); });
</script>
</body>
