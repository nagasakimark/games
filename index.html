<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マーク先生のゲームセンター</title>
<meta name="description" content="すきな ゲームを えらんで、えいごで あそぼう！ マーク先生の えいごゲーム。">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* ground, ink, paper */
    --ground:#FFD23F;
    --ink:#142850;
    --paper:#FFFFFF;

    --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Meiryo",sans-serif;
    --text:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;

    --m:16px;          /* outer margin */
    --gap:10px;        /* board gap */
    --r:22px;          /* tile radius, used everywhere */
    --art:2;           /* art aspect (width / height) */
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--text);
    font-weight:700;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  img{display:block}
  :focus-visible{outline:4px solid var(--ink);outline-offset:3px}

  .wrap{max-width:1520px;margin:0 auto;padding:0 var(--m)}

  /* ---------- Top bar ---------- */
  .top{display:flex;align-items:center;gap:24px;padding:20px 0 18px}
  .title h1{
    margin:0;
    font-family:var(--display);font-weight:400;
    font-size:clamp(28px,3.3vw,50px);
    line-height:1;letter-spacing:-.015em;
  }
  .title p{margin:8px 0 0;font-size:18px;font-weight:900}
  .pick{
    margin-left:auto;flex:none;
    display:inline-flex;align-items:center;gap:12px;
    font-family:var(--display);font-weight:400;font-size:19px;
    color:var(--paper);background:var(--ink);
    border:0;border-radius:999px;
    padding:12px 24px 12px 14px;
    cursor:pointer;
    transition:transform .15s var(--ease);
  }
  /* the dial is a small picture of the roulette: one flat slice per game colour */
  .pick .dial{
    width:30px;height:30px;border-radius:50%;flex:none;
    background:conic-gradient(#C8102E 0 45deg,#E85D10 0 90deg,#FFD23F 0 135deg,#3E9431 0 180deg,#0F95B5 0 225deg,#2F7FE0 0 270deg,#1B2F6B 0 315deg,#D63D82 0);
    border:3px solid var(--paper);
    transition:transform .4s var(--ease);
  }
  .pick:hover{transform:translateY(-2px)}
  .pick:hover .dial{transform:rotate(90deg)}
  .pick:active{transform:translateY(1px) scale(.98)}
  .pick[aria-busy="true"] .dial{animation:turn .5s linear infinite}
  @keyframes turn{to{transform:rotate(360deg)}}
  .js-off .pick{display:none}

  /* ---------- Board ---------- */
  .board{
    list-style:none;margin:0;padding:0;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:var(--gap);
  }
  .tile{position:relative}
  .tile a{
    display:flex;flex-direction:column;height:100%;
    text-decoration:none;color:var(--paper);
    background:var(--c);
    border-radius:var(--r);
    overflow:hidden;
    transition:transform .18s var(--ease);
  }
  .art{position:relative;aspect-ratio:var(--art);overflow:hidden;background:var(--c)}
  .art img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
  .bar{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px 14px 18px}
  .bar .words{flex:1;min-width:0}
  .bar h2{
    margin:0;font-family:var(--display);font-weight:400;
    font-size:23px;line-height:1.1;letter-spacing:-.01em;
  }
  .bar .what{margin:5px 0 0;font-size:15.5px;font-weight:900;line-height:1.35}
  .bar .learn{margin:2px 0 0;font-size:14px;font-weight:700;line-height:1.35}
  .bar .learn b{font-weight:900}
  .what,.learn,.bar h2,.jp,.title p{word-break:keep-all;overflow-wrap:anywhere}
  .play{
    flex:none;width:52px;height:52px;border-radius:50%;
    background:var(--paper);color:var(--c);
    display:grid;place-items:center;
    transition:transform .2s var(--ease);
  }
  .play svg{width:20px;height:20px;margin-left:4px;fill:currentColor}
  .tile a:hover{transform:translateY(-4px)}
  .tile a:hover .art img{transform:scale(1.05)}
  .tile a:hover .play{transform:scale(1.12)}
  .tile a:active{transform:translateY(1px)}

  /* Roulette states */
  .board.spinning .tile a,.board.landed .tile a{transition:transform .12s var(--ease), opacity .2s, filter .2s}
  .board.spinning .tile:not(.lit) a,.board.landed .tile:not(.won) a{filter:grayscale(1) brightness(.8) contrast(.9)}
  .tile.lit a,.tile.won a{transform:scale(1.03);outline:6px solid var(--paper);outline-offset:0}
  .flag{
    position:absolute;left:14px;top:14px;z-index:2;
    background:var(--paper);color:var(--ink);
    font-family:var(--display);font-size:20px;
    border-radius:999px;padding:8px 18px;
    opacity:0;transform:translateY(8px) scale(.9);pointer-events:none;
    transition:opacity .25s var(--ease), transform .35s var(--ease);
  }
  .tile.won .flag{opacity:1;transform:none}

  /* Entrance: one orchestrated moment (content shows without script) */
  .enter .tile{opacity:0;transform:translateY(24px)}
  .enter.go .tile{opacity:1;transform:none;transition:opacity .5s var(--ease), transform .6s var(--ease);transition-delay:calc(var(--i) * 70ms)}

  /* ---------- Close ---------- */
  .close{background:var(--ink);color:var(--paper);margin-top:72px}
  .close .wrap{padding-top:56px;padding-bottom:40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
  .close .name{
    grid-column:1 / -1;
    margin:0;font-family:var(--display);font-weight:400;
    font-size:min(calc((100vw - 2 * var(--m)) / 12.75), 116px);line-height:1;letter-spacing:-.02em;
    white-space:nowrap;
  }
  .close p{margin:0;font-size:18px;font-weight:900;line-height:1.6;max-width:none}
  .close .sign{font-family:var(--display);font-size:16px;text-align:right}

  /* ---------- Widths ---------- */
  @media (max-width:1100px){
    .board{grid-template-columns:repeat(2,minmax(0,1fr))}
    .bar h2{font-size:26px}
  }
  @media (max-width:640px){
    :root{--m:14px;--gap:12px;--r:20px}
    .top{flex-direction:column;align-items:stretch;gap:12px;padding-top:16px}
    .title h1{font-size:30px;line-height:1.1}
    .title p{font-size:16px}
    .pick{margin-left:0;justify-content:center}
    .board{grid-template-columns:1fr}
    .bar h2{font-size:24px}
    .close .wrap{grid-template-columns:1fr}
    .close .sign{text-align:left}
    .close .name{white-space:normal;font-size:40px}
  }
  /* Chromebook window: keep the whole board on one screen */
  @media (min-width:1101px) and (max-height:700px){
    :root{--art:2.25;--gap:9px}
    .top{padding:14px 0 12px}
    .title h1{font-size:40px}
    .title p{font-size:16px;margin-top:6px}
    .pick{font-size:17px;padding:9px 20px 9px 10px}
    .bar{padding:9px 12px 11px 16px}
    .bar h2{font-size:21px}
    .bar .what{font-size:14.5px;margin-top:4px}
    .bar .learn{font-size:13px}
    .play{width:46px;height:46px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .enter .tile{opacity:1;transform:none}
  }
</style>
</head>
<body class="js-off">

<div class="wrap">
  <header class="top">
    <div class="title">
      <h1>マーク先生のゲームセンター</h1>
      <p>すきな ゲームを えらんで、えいごで あそぼう！</p>
    </div>
    <button class="pick" id="pick" type="button"><span class="dial" aria-hidden="true"></span><span class="label">どれに しようかな？</span></button>
  </header>

  <ul class="board" id="board" aria-label="ゲーム"></ul>
  <noscript>
    <ul class="board">
      <li class="tile" style="--c:#1B2F6B"><a href="https://nagasakimark.github.io/type/"><div class="art"><img src="images/type.jpg" alt=""></div><div class="bar"><div class="words"><h2>タイピングマスター</h2></div></div></a></li>
      <li class="tile" style="--c:#0F95B5"><a href="https://nagasakimark.github.io/hop/"><div class="art"><img src="images/hop.jpg" alt=""></div><div class="bar"><div class="words"><h2>メガネホップ</h2></div></div></a></li>
      <li class="tile" style="--c:#D63D82"><a href="https://nagasakimark.github.io/witchsoup/"><div class="art"><img src="images/witchsoup.jpg" alt=""></div><div class="bar"><div class="words"><h2>ウィッチズ・スープ</h2></div></div></a></li>
      <li class="tile" style="--c:#C8102E"><a href="https://nagasakimark.github.io/ukexpress/"><div class="art"><img src="images/ukexpress.jpg" alt=""></div><div class="bar"><div class="words"><h2>UKエクスプレス</h2></div></div></a></li>
      <li class="tile" style="--c:#3E9431"><a href="https://nagasakimark.github.io/hamanomachi3/"><div class="art"><img src="images/hamanomachi.jpg" alt=""></div><div class="bar"><div class="words"><h2>はまのまち</h2></div></div></a></li>
      <li class="tile" style="--c:#E85D10"><a href="https://nagasakimark.github.io/chef/"><div class="art"><img src="images/chef.jpg" alt=""></div><div class="bar"><div class="words"><h2>トマチシェフ</h2></div></div></a></li>
      <li class="tile" style="--c:#2F7FE0"><a href="https://nagasakimark.github.io/japanguesser/"><div class="art"><img src="images/japanguesser.jpg" alt=""></div><div class="bar"><div class="words"><h2>ジャパンゲッサー</h2></div></div></a></li>
      <li class="tile" style="--c:#0D7B85"><a href="https://nagasakimark.github.io/globeguesser/"><div class="art"><img src="images/globeguesser.jpg" alt=""></div><div class="bar"><div class="words"><h2>グローブゲッサー</h2></div></div></a></li>
    </ul>
  </noscript>
</div>

<footer class="close">
  <div class="wrap">
    <p class="name">マーク先生のゲームセンター</p>
    <p class="jp">えいごは、あそぶと おぼえられる。<br>ながさきの 教室から、あたらしい ゲームを とどけます。</p>
    <span class="sign">Made in Nagasaki by Mark Sensei</span>
  </div>
</footer>

<script>
  // Add a game: add one entry and put its picture in images/.
  // color = the main colour of the game's own picture.
  const GAMES = [
    { name:"タイピングマスター", what:"えいごの ことばを タイプしよう", learn:"キーボードと えいたんご",
      url:"https://nagasakimark.github.io/type/", img:"images/type.jpg", color:"#1B2F6B" },
    { name:"メガネホップ", what:"音を きいて、いしを ジャンプ", learn:"フォニックス",
      url:"https://nagasakimark.github.io/hop/", img:"images/hop.jpg", color:"#0F95B5" },
    { name:"ウィッチズ・スープ", what:"まほうの スープを つくろう", learn:"ざいりょうの えいご",
      url:"https://nagasakimark.github.io/witchsoup/", img:"images/witchsoup.jpg", color:"#D63D82" },
    { name:"UKエクスプレス", what:"電車で イギリスを 旅しよう", learn:"イギリスの 町と ぶんか",
      url:"https://nagasakimark.github.io/ukexpress/", img:"images/ukexpress.jpg", color:"#C8102E" },
    { name:"はまのまち", what:"えいごで みちあんない しよう", learn:"Go straight. Turn left.",
      url:"https://nagasakimark.github.io/hamanomachi3/", img:"images/hamanomachi.jpg", color:"#3E9431" },
    { name:"トマチシェフ", what:"ちゅうもんの りょうりを つくろう", learn:"たべものの えいご",
      url:"https://nagasakimark.github.io/chef/", img:"images/chef.jpg", color:"#E85D10" },
    { name:"ジャパンゲッサー", what:"ここは 日本の どこかな？", learn:"日本の ちり",
      url:"https://nagasakimark.github.io/japanguesser/", img:"images/japanguesser.jpg", color:"#2F7FE0" },
    { name:"グローブゲッサー", what:"ここは 世界の どこかな？", learn:"世界の 国",
      url:"https://nagasakimark.github.io/globeguesser/", img:"images/globeguesser.jpg", color:"#0D7B85" },
  ];

  document.body.classList.remove("js-off");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const board = document.getElementById("board");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  board.innerHTML = GAMES.map((g, i) => `
    <li class="tile" style="--c:${g.color};--i:${i}">
      <a href="${g.url}" aria-label="${esc(g.name)}：${esc(g.what)}">
        <div class="art"><img src="${g.img}" alt="" width="760" height="400"></div>
        <div class="bar">
          <div class="words">
            <h2>${esc(g.name)}</h2>
            <p class="what">${esc(g.what)}</p>
            <p class="learn"><b>まなべる</b>　${esc(g.learn)}</p>
          </div>
          <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 6 3.5z"/></svg></span>
        </div>
      </a>
      <span class="flag" aria-hidden="true">これに けってい！</span>
    </li>`).join("");

  /* One entrance for the board */
  if (!reduce) {
    board.classList.add("enter");
    requestAnimationFrame(() => requestAnimationFrame(() => board.classList.add("go")));
    setTimeout(() => board.classList.remove("enter", "go"), 1400);
  }

  /* どれに しようかな — the roulette */
  const tiles = [...board.children];
  const pick = document.getElementById("pick");
  const label = pick.querySelector(".label");
  let busy = false, clearTimer;

  function clearWin(){
    board.classList.remove("landed");
    tiles.forEach(t => t.classList.remove("won"));
  }
  function land(i){
    board.classList.remove("spinning");
    tiles.forEach(t => t.classList.remove("lit"));
    board.classList.add("landed");
    tiles[i].classList.add("won");
    tiles[i].querySelector("a").focus({ preventScroll:true });
    tiles[i].scrollIntoView({ block:"nearest", behavior: reduce ? "auto" : "smooth" });
    pick.removeAttribute("aria-busy");
    label.textContent = "もう いっかい";
    busy = false;
    clearTimeout(clearTimer);
    clearTimer = setTimeout(clearWin, 8000);
  }
  pick.addEventListener("click", () => {
    if (busy) return;
    busy = true; clearWin();
    pick.setAttribute("aria-busy", "true");
    const target = Math.floor(Math.random() * tiles.length);
    if (reduce) return land(target);
    // twice round the board, then on to the chosen game, slowing down at the end
    const steps = tiles.length * 2 + target + 1;
    let n = 0, delay = 55;
    board.classList.add("spinning");
    (function step(){
      tiles.forEach(t => t.classList.remove("lit"));
      const at = n % tiles.length;
      tiles[at].classList.add("lit");
      n++;
      if (n >= steps) return setTimeout(() => land(at), 260);
      if (n > steps - 8) delay *= 1.32;
      setTimeout(step, delay);
    })();
  });
  board.addEventListener("pointerdown", e => { if (!e.target.closest(".won")) clearWin(); });
</script>
</body>
</html>
