<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Sensei's Games | えいごゲームひろば</title>
<meta name="description" content="えいごを たのしく まなべる ゲームが いっぱい！">
<meta name="theme-color" content="#5EC4F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<style>
  :root{
    --ink:#14336B;
    --ink-soft:#3B527A;
    --orange:#FF6A13;
    --sun:#FFD12E;
    --sun-deep:#FFB400;
    --sky:#DDF3FF;
    --grass:#38A94A;
    --white:#fff;
    --jp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
    --en:"Lilita One","M PLUS Rounded 1c",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--jp);
    font-weight:700;
    color:var(--ink);
    background:var(--sky);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit}
  img{display:block}
  .icon{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  :focus-visible{outline:4px solid var(--orange);outline-offset:3px}

  /* ============ Masthead ============ */
  .masthead{position:relative;height:230px;overflow:hidden}
  .scene{position:absolute;inset:0;width:100%;height:100%}
  .clouds{animation:drift 70s linear infinite alternate}
  @keyframes drift{to{transform:translateX(-160px)}}
  .boat{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(3px) rotate(1.5deg)}}

  .mast-in{position:relative;max-width:1180px;height:100%;margin:0 auto;padding:0 24px}
  .brand{position:absolute;left:12px;top:10px;display:block;width:420px;height:195px;text-decoration:none}
  .brand svg.logo{position:relative;width:100%;height:100%;overflow:visible}
  .burst{
    position:absolute;left:50%;top:52%;width:620px;height:620px;margin:-310px 0 0 -310px;
    background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.42) 0 9deg, rgba(255,255,255,0) 9deg 22.5deg);
    -webkit-mask:radial-gradient(circle, #000 18%, transparent 62%);
            mask:radial-gradient(circle, #000 18%, transparent 62%);
    animation:spin 80s linear infinite;
    pointer-events:none;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand:hover .logo{animation:wobble .5s ease}
  @keyframes wobble{30%{transform:rotate(-2deg) scale(1.02)}65%{transform:rotate(1.5deg)}}

  main{max-width:1180px;margin:0 auto;padding:26px 24px 0}

  /* ============ Billboard ============ */
  .billboard{
    --gc:#2457C5;
    display:grid;
    grid-template-columns:minmax(0,1.42fr) minmax(0,1fr);
    border:3px solid var(--ink);
    border-radius:26px;
    overflow:hidden;
    background:var(--gc);
    box-shadow:0 8px 0 rgba(20,51,107,.22);
    transition:background-color .45s ease;
  }
  .bb-media{position:relative;aspect-ratio:19/10;min-height:100%;border-right:3px solid var(--ink);background:#bfe3f7;cursor:pointer;display:block}
  .bb-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease}
  .bb-media img.on{opacity:1}
  .bb-info{
    position:relative;
    padding:26px 30px 30px;
    color:#fff;
    display:flex;flex-direction:column;align-items:flex-start;
    isolation:isolate;
  }
  .bb-info::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:repeating-conic-gradient(from -8deg at 100% 100%, rgba(255,255,255,.09) 0 5deg, rgba(255,255,255,0) 5deg 10deg);
  }
  .cat-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;color:var(--gc);
    border-radius:999px;padding:4px 13px 4px 9px;
    font-size:15px;font-weight:800;
  }
  .cat-pill .icon{width:20px;height:20px}
  .bb-title{font-size:42px;font-weight:900;line-height:1.15;margin:14px 0 0;letter-spacing:.01em;text-shadow:0 3px 0 rgba(20,51,107,.35)}
  .bb-en{font-family:var(--en);font-size:22px;opacity:.88;margin-top:2px;letter-spacing:.01em}
  .bb-desc{font-size:20px;font-weight:800;line-height:1.5;margin:14px 0 0}
  .bb-learn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
  .bb-learn .lbl{font-size:14px;font-weight:800;opacity:.9}
  .bb-learn .chip{background:rgba(255,255,255,.95);color:var(--ink);border-radius:999px;padding:4px 13px;font-size:15px;font-weight:800}
  .bb-play{margin-top:auto;padding-top:20px}

  .btn-play{
    position:relative;overflow:hidden;
    display:inline-flex;align-items:center;gap:12px;
    padding:9px 30px 9px 10px;
    background:linear-gradient(#FFE766, var(--sun) 55%, var(--sun-deep));
    color:var(--ink);text-decoration:none;
    border:3px solid var(--ink);border-radius:999px;
    font-size:25px;font-weight:900;letter-spacing:.06em;
    box-shadow:0 6px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn-play .pc{width:42px;height:42px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
  .btn-play .pc svg{width:18px;height:18px;margin-left:3px;fill:#fff}
  .btn-play::after{
    content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent);
    transform:skewX(-20deg);
  }
  .btn-play:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
  .btn-play:hover::after{animation:shine .7s ease}
  .btn-play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  @keyframes shine{to{left:130%}}

  .bb-timer{position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.22)}
  .bb-timer i{display:block;height:100%;width:0;background:rgba(255,255,255,.9)}
  .bb-timer.run i{animation:fill var(--dur,6s) linear forwards}
  .billboard.paused .bb-timer i{animation-play-state:paused}
  @keyframes fill{to{width:100%}}

  /* Thumbnail selector */
  .strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;margin-top:20px}
  .thumb{
    position:relative;padding:0;
    aspect-ratio:19/10;border-radius:12px;overflow:hidden;cursor:pointer;
    border:3px solid rgba(20,51,107,.18);background:#fff;
    transition:transform .15s ease, border-color .15s ease;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.75) brightness(.97);transition:filter .2s}
  .thumb:hover img{filter:none}
  .thumb[aria-selected="true"]{border-color:var(--ink);transform:translateY(-4px)}
  .thumb[aria-selected="true"] img{filter:none}
  .thumb[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--c)}

  /* ============ Games list ============ */
  .list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:48px 0 20px}
  .list-head h2{margin:0;font-size:30px;font-weight:900;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
  .list-head h2 .badge{
    width:46px;height:46px;border-radius:14px;background:var(--orange);color:#fff;
    display:grid;place-items:center;border:3px solid var(--ink);transform:rotate(-6deg);
    box-shadow:0 4px 0 var(--ink);
  }
  .list-head h2 .badge .icon{width:26px;height:26px;stroke-width:2.6}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .fbtn{
    display:inline-flex;align-items:center;gap:7px;
    background:#fff;border:3px solid var(--ink);border-radius:999px;
    padding:6px 16px 6px 8px;font-size:16px;font-weight:800;cursor:pointer;
    box-shadow:0 3px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease, background-color .15s;
  }
  .fbtn .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sky)}
  .fbtn .icon{width:18px;height:18px}
  .fbtn:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
  .fbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
  .fbtn[aria-pressed="true"] .ic{background:var(--sun);color:var(--ink)}
  .fbtn .n{font-family:var(--en);font-weight:400;font-size:15px;opacity:.55;margin-left:2px}

  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 24px}
  .card{
    --c:var(--orange);
    position:relative;
    display:flex;flex-direction:column;
    background:#fff;
    border:3px solid var(--ink);border-radius:20px;
    overflow:hidden;
    text-decoration:none;color:var(--ink);
    box-shadow:0 7px 0 var(--c);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .card:hover{transform:translateY(-5px);box-shadow:0 12px 0 var(--c)}
  .card:active{transform:translateY(3px);box-shadow:0 3px 0 var(--c)}
  .card[hidden]{display:none}
  .card-media{aspect-ratio:19/10;overflow:hidden;border-bottom:3px solid var(--ink);background:var(--c)}
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
  .card:hover .card-media img{transform:scale(1.06)}
  .card-body{display:flex;flex-direction:column;flex:1;padding:13px 16px 16px}
  .card-cat{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:var(--c)}
  .card-cat .icon{width:17px;height:17px}
  .card h3{margin:5px 0 0;font-size:21px;font-weight:900;line-height:1.25;letter-spacing:.01em}
  .card-en{font-family:var(--en);font-size:15px;color:var(--ink-soft);opacity:.75;margin-top:1px}
  .card p{margin:9px 0 14px;font-size:15px;font-weight:700;line-height:1.55;color:var(--ink-soft)}
  .card-foot{margin-top:auto;display:flex;align-items:flex-end;gap:10px}
  .card-learn{display:flex;flex-wrap:wrap;gap:5px;flex:1}
  .card-learn .chip{
    font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;
    background:color-mix(in srgb, var(--c) 13%, white);
    color:color-mix(in srgb, var(--c) 70%, var(--ink));
  }
  .go{
    width:46px;height:46px;flex:none;border-radius:50%;
    background:var(--c);border:3px solid var(--ink);
    display:grid;place-items:center;
    box-shadow:0 3px 0 var(--ink);
    transition:transform .2s ease;
  }
  .go svg{width:16px;height:16px;fill:#fff;margin-left:3px}
  .card:hover .go{transform:scale(1.12)}

  .jp-wrap{word-break:keep-all;overflow-wrap:anywhere}

  /* ============ Footer ============ */
  footer{margin-top:72px;position:relative;color:#fff;text-align:center}
  footer svg{display:block;width:100%;height:46px}
  .foot-in{background:var(--grass);padding:6px 24px 28px;margin-top:-1px}
  .foot-in strong{display:block;font-size:20px;font-weight:900;letter-spacing:.03em}
  .foot-in small{display:block;margin-top:6px;font-family:var(--en);font-size:15px;opacity:.85;letter-spacing:.02em}

  /* ============ Responsive ============ */
  @media (max-width:1060px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .bb-title{font-size:34px}
  }
  @media (max-width:860px){
    .billboard{grid-template-columns:1fr}
    .bb-media{border-right:none;border-bottom:3px solid var(--ink)}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .strip{grid-template-columns:repeat(8,128px);overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
  }
  @media (max-width:560px){
    .masthead{height:170px}
    .brand{left:0;top:8px;width:300px;height:139px}
    .burst{width:440px;height:440px;margin:-220px 0 0 -220px}
    main{padding:20px 16px 0}
    .bb-info{padding:20px}
    .bb-title{font-size:30px}
    .bb-desc{font-size:17px}
    .grid{grid-template-columns:1fr}
    .list-head h2{font-size:24px}
  }
  /* Chromebooks: short screens. Keep the billboard and the selector on one screen. */
  @media (min-width:861px) and (max-height:720px){
    .masthead{height:168px}
    .brand{top:7px;width:322px;height:150px}
    .burst{width:500px;height:500px;margin:-250px 0 0 -250px}
    main{padding-top:20px}
    .bb-media{aspect-ratio:auto;min-height:268px}
    .bb-info{padding:18px 26px 22px}
    .bb-title{font-size:34px;margin-top:10px}
    .bb-en{font-size:19px}
    .bb-desc{font-size:18px;margin-top:8px}
    .bb-learn{margin-top:10px}
    .bb-play{padding-top:12px}
    .btn-play{font-size:22px}
    .btn-play .pc{width:36px;height:36px}
    .strip{margin-top:16px;gap:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>

        <div class="card-foot">
          <div class="card-learn">${g.learn.map(l => `<span class="chip jp-wrap">${esc(l)}</span>`).join("")}</div>
          <span class="go" aria-hidden="true">${PLAY}</span>
        </div>
      </div>
    </a>`).join("");

  /* ---------- Filters ---------- */
  const FILTERS = [{ id:"all", label:"ぜんぶ", icon:"i-all" },
    ...Object.entries(CATS).map(([id, c]) => ({ id, ...c }))];
  $("filters").innerHTML = FILTERS.map(f => {
    const n = f.id === "all" ? GAMES.length : GAMES.filter(g => g.cat === f.id).length;
    return `<button class="fbtn" data-f="${f.id}" aria-pressed="false"><span class="ic">${icon(f.icon)}</span>${f.label}<span class="n">${n}</span></button>`;
  }).join("");
  function filter(id){
    document.querySelectorAll(".fbtn").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === id));
    document.querySelectorAll(".card").forEach(c => c.hidden = !(id === "all" || c.dataset.cat === id));
  }
  $("filters").addEventListener("click", e => { const b = e.target.closest(".fbtn"); if (b) filter(b.dataset.f); });
  filter("all");

  /* ---------- Billboard ---------- */
  const bb = $("billboard"), media = $("bbMedia"), timer = $("bbTimer");
  const DUR = 6000;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  GAMES.forEach(g => { const im = new Image(); im.src = g.img; im.alt = ""; media.appendChild(im); });
  const pics = [...media.children];

  $("strip").innerHTML = GAMES.map((g, i) =>
    `<button class="thumb" role="tab" style="--c:${g.color}" data-i="${i}" aria-label="${esc(g.ja)}" aria-selected="false"><img src="${g.img}" alt=""></button>`).join("");
  const thumbs = [...document.querySelectorAll(".thumb")];

  let cur = 0, t = null, paused = false;
  function show(i){
    cur = (i + GAMES.length) % GAMES.length;
    const g = GAMES[cur], c = CATS[g.cat];
    bb.style.setProperty("--gc", g.color);
    pics.forEach((p, k) => p.classList.toggle("on", k === cur));
    thumbs.forEach((b, k) => b.setAttribute("aria-selected", k === cur));
    $("bbCat").innerHTML = icon(c.icon) + c.label;
    $("bbTitle").textContent = g.ja;
    $("bbEn").textContent = g.en;
    $("bbDesc").textContent = g.desc;
    $("bbLearn").innerHTML = `<span class="lbl">まなべること</span>` + g.learn.map(l => `<span class="chip">${esc(l)}</span>`).join("");
    $("bbPlay").href = media.href = g.url;
    restart();
  }
  function restart(){
    clearTimeout(t);
    timer.classList.remove("run"); void timer.offsetWidth;
    if (reduce) return;
    timer.style.setProperty("--dur", DUR + "ms");
    timer.classList.add("run");
    if (!paused) t = setTimeout(() => show(cur + 1), DUR);
  }
  function setPaused(p){
    paused = p; bb.classList.toggle("paused", p);
    if (p) clearTimeout(t); else restart();
  }
  $("strip").addEventListener("click", e => { const b = e.target.closest(".thumb"); if (b) show(+b.dataset.i); });
  [bb, $("strip")].forEach(el => {
    el.addEventListener("mouseenter", () => setPaused(true));
    el.addEventListener("mouseleave", () => setPaused(false));
    el.addEventListener("focusin", () => setPaused(true));
    el.addEventListener("focusout", () => setPaused(false));
  });
  show(Math.floor(Math.random() * GAMES.length));
</script>
</body>
</html>
